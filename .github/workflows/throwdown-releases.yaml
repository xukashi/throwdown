name: throwdown-release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Major release
          - Point release
          - Bug fix release
        default: Point release

jobs:
  flatpak:
    name: "Flatpak ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: throwdown-${{ matrix.arch }}.flatpak
          manifest-path: io.github.yioannides.Throwdown.json
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}

  release:
    name: Create new release
    needs: [flatpak]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Get next version
        id: version
        run: |
          current=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          echo "Current version: $current"

          version=${current#v}

          IFS='.' read -r major minor patch <<< "$version"
          patch=${patch:-0}

          if [ "${{ inputs.release_type }}" = "Major release" ]; then
            next="v$((major + 1)).0"
          elif [ "${{ inputs.release_type }}" = "Point release" ]; then
            next="v${major}.$((minor + 1))"
          elif [ "${{ inputs.release_type }}" = "Bug fix release" ]; then
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Next version: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.flatpak" -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create new release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release-files/*.flatpak
          generate_release_notes: true
          prerelease: false
          make_latest: true
